{# blog/templates/blog/comment_confirm_delete.html #}
{% extends 'blog/base.html' %}
{% block title %}Delete comment{% endblock %}
{% block content %}
  <h2>Confirm delete</h2>
  <p>Are you sure you want to delete this comment?</p>
  <div class="comment-body">{{ object.content|linebreaks }}</div>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'blog:post-detail' object.post.pk %}">Cancel</a>
  </form>
{% endblock %}
